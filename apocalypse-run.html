<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apocalypse Run — GLITCHED MATRIX Prototype Lab</title>
  <meta name="description" content="Play and download Apocalypse Run, a post-apocalyptic driving survival game from GLITCHED MATRIX Prototype Lab." />
  <link rel="stylesheet" href="./style.css?v=20260802-apocalypse-run" />
  <link rel="stylesheet" href="./assets/css/site_readability_pass33.css?v=20260802-apocalypse-run" />
  <link rel="stylesheet" href="./assets/css/site_layout_pass35.css?v=20260802-apocalypse-run" />
  <style>
    .apocalypse-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .apocalypse-card {
      width: min(920px, 100%);
      padding: clamp(22px, 4vw, 42px);
    }

    .apocalypse-card h1 {
      margin: 8px 0 12px;
    }

    .apocalypse-card .lead {
      max-width: 760px;
      margin-bottom: 24px;
    }

    .apocalypse-embed-shell {
      width: 100%;
      max-width: 552px;
      min-height: 167px;
      margin: 0 auto 24px;
      overflow: hidden;
      border-radius: 12px;
      background: #0a0505;
      border: 1px solid rgba(204, 20, 20, 0.55);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .apocalypse-embed-shell iframe {
      display: block;
      width: 100%;
      height: 167px;
      border: 0;
    }

    .apocalypse-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .apocalypse-note {
      margin: 20px auto 0;
      max-width: 680px;
      text-align: center;
      opacity: 0.82;
    }

    @media (max-width: 600px) {
      .apocalypse-page {
        padding: 18px 10px;
      }

      .apocalypse-card {
        padding: 20px 14px;
      }

      .apocalypse-embed-shell {
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="page-backdrop"></div>
  <div class="grid-overlay"></div>
  <div class="noise-overlay"></div>
  <div class="scanlines"></div>

  <main class="apocalypse-page shell">
    <section class="panel content-card apocalypse-card" aria-labelledby="apocalypse-title">
      <span class="section-label">GLITCHED MATRIX RELEASE</span>
      <h1 id="apocalypse-title">Apocalypse Run</h1>
      <p class="lead">Keep the engine alive, survive the wasteland, and fight your way toward Sanctuary.</p>

      <div class="apocalypse-embed-shell">
        <iframe
          src="https://itch.io/embed/4857214"
          width="552"
          height="167"
          title="Apocalypse Run on itch.io"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
          <a href="https://glitched-matrix.itch.io/apocalypse-run">Apocalypse Run by Gleebs</a>
        </iframe>
      </div>

      <div class="apocalypse-actions">
        <a class="btn btn-primary" href="https://glitched-matrix.itch.io/apocalypse-run" target="_blank" rel="noopener noreferrer">Open on itch.io</a>
        <a class="btn btn-secondary" href="./index.html">Back to Prototype Lab</a>
      </div>

      <p class="apocalypse-note">The itch.io panel is isolated on this page so updates to the game listing cannot interfere with the main Prototype Lab site.</p>
    </section>
  </main>
</body>
</html>
