  <title>Apocalypse Run — GLITCHED MATRIX Prototype Lab</title>

  <style>
    :root{--bg:#070708;--panel:#111115;--text:#f4f1f1;--muted:#b8b0b0;--accent:#ef3038;--line:#342025}

  </style>
</head>

  <main>
    <div class="label">GLITCHED MATRIX RELEASE</div>
